name: PHP and JavaScript syntax

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mysqli
          coverage: none

      - name: Lint all PHP source files
        run: |
          find . -type f -name '*.php' -not -path './vendor/*' -print0 |
            xargs -0 -r -n1 php -l

      - name: Check browser JavaScript syntax
        run: node --check static/js/javascript.js
